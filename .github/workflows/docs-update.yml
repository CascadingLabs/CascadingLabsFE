name: Update published Yosoi docs
on:
  repository_dispatch:
    types: [yosoi-docs-published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-pointer-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Resolve latest published docs pointer
        run: bun scripts/docs/bundle.mjs --lock-only
      - name: Trigger the existing Cloudflare Git deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs-bundle.lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: select latest published Yosoi snapshot'
            git push origin HEAD:main
          fi
