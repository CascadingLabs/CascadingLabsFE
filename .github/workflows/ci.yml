name: Frontend CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      YOSOI_REPO_ROOT: .generated/yosoi-source
      DOCS_PREVIEW: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prepare published docs (no Rust compilation)
        run: bun scripts/docs/bundle.mjs --prepare-only
      - run: bun run check
      - run: bun run test
      - name: Build static site
        run: bunx --no-install astro build
